      summary: Gửi message bằng API token
      description: "Dùng header `Authorization: Bearer {api_token}`. Token cần scope `message.write`; chủ sở hữu token phải còn là thành viên active và đã chấp nhận đúng phiên bản tài liệu pháp lý hiện hành."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationMessageRequest"
      responses:
        "201":
          description: Message tích hợp đã được gửi
        "401":
          description: Token đã bị thu hồi/hết hạn, mất scope, không còn chủ sở hữu hợp lệ hoặc chủ sở hữu không còn active trong workspace
        "409":
          description: Chủ sở hữu token chưa chấp nhận đúng phiên bản Terms/AUP và Privacy Policy hiện hành
