      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModerationReportRequest"
      responses:
        "201":
          description: Report accepted for moderation
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/ModerationReport"
        "409":
          description: The reporter already has an open report for this target
        "429":
          description: Per-user report submission limit exceeded
    get:
      tags: [Moderation]
      summary: List reports for workspace moderators
      description: Requires the moderation.manage workspace permission.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, reviewing, resolved, dismissed]
        - name: target_type
          in: query
          schema:
            type: string
            enum: [message, user]
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Moderation queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [reports]
                        properties:
                          reports:
                            type: array
                            items:
                              $ref: "#/components/schemas/ModerationReport"
