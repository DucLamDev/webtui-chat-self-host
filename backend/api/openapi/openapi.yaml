  /api/v1/workspaces/{workspace_id}/messages/search:
    get:
      summary: Tìm kiếm tin nhắn bằng PostgreSQL full text search
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
        - name: channel_id
          in: query
          schema:
            type: string
