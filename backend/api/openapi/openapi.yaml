openapi: 3.1.0
info:
  title: WebTui Chat Backend API
  version: 0.9.0
  description: Contract nền cho backend WebTui Chat. Tài liệu API được cập nhật theo từng phase backend.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Kiểm tra API còn sống
      responses:
        "200":
          description: API đang hoạt động
  /ready:
    get:
      security: []
      summary: Kiểm tra API sẵn sàng nhận traffic
      responses:
        "200":
          description: API sẵn sàng
  /version:
    get:
      security: []
      summary: Thông tin phiên bản backend
      responses:
        "200":
          description: Thông tin phiên bản
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /desktop/releases/{channel}/{target}/{arch}/{current_version}:
    get:
      security: []
      summary: Manifest signed updater cho desktop app
      description: Trả manifest Tauri updater đã publish theo channel/target/arch. Trả 204 khi chưa cấu hình hoặc chưa có bản mới.
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum: [stable, beta]
        - name: target
          in: path
          required: true
          schema:
            type: string
            example: windows-x86_64
        - name: arch
          in: path
          required: true
          schema:
            type: string
            example: x86_64
        - name: current_version
          in: path
          required: true
          schema:
            type: string
            example: 0.1.0
      responses:
        "200":
          description: Manifest có bản cập nhật signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopUpdaterManifest"
        "204":
          description: Không có bản cập nhật hoặc chưa cấu hình manifest
  /mobile/releases/{platform}/{channel}/{current_version}:
    get:
      security: []
      summary: Metadata phiên bản mobile app
      description: Trả manifest mobile nếu đã publish, hoặc policy fallback từ cấu hình backend.
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [android, ios]
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum: [stable, beta, internal]
        - name: current_version
          in: path
          required: true
          schema:
            type: string
            example: 1.0.0
      responses:
        "200":
          description: Metadata hoặc manifest phiên bản mobile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileReleaseManifest"
        "204":
          description: Chưa có manifest mobile phù hợp
  /downloads/manifest/{channel}:
    get:
      security: []
      summary: Manifest public cho file download
      description: Dùng cho APK/Desktop direct download để mobile/web kiểm tra checksum trước khi tải.
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum: [stable, beta, internal]
      responses:
        "200":
          description: Manifest download public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadManifest"
        "204":
          description: Chưa cấu hình download manifest
  /metrics:
    get:
      security: []
      summary: Metrics Prometheus của API
      description: Bật bằng `METRICS_ENABLED=true`, trả metric kỹ thuật dạng text/plain.
      responses:
        "200":
          description: Metrics Prometheus
          content:
            text/plain:
              schema:
                type: string
  /api:
    get:
      security: []
      summary: Entry point API tren cung domain voi web
      description: Tra thong tin API; cac endpoint nghiep vu nam duoi `/api/v1`.
      responses:
        "200":
          description: API hoat dong
  /api/v1:
    get:
      security: []
      summary: Thông tin API v1
      responses:
        "200":
          description: API v1 hoạt động
  /.well-known/vpsttt-chat:
    get:
      security: []
      summary: Discovery public theo domain
      description: Client domain-first goi endpoint nay tren domain cua zone de lay runtime URL va capabilities.
      responses:
        "200":
          description: Thong tin discovery cua zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneDiscovery"
  /api/v1/discovery:
    get:
      security: []
      summary: Resolve domain thanh zone chat
      parameters:
        - name: domain
          in: query
          required: false
          schema:
            type: string
          description: Domain can resolve. Neu bo trong backend dung Host header.
      responses:
        "200":
          description: Discovery duoc boc trong envelope API
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          discovery:
                            $ref: "#/components/schemas/ZoneDiscovery"
  /api/v1/capabilities:
    get:
      security: []
      summary: Capabilities public cua zone
      parameters:
        - name: domain
          in: query
          required: false
          schema:
            type: string
          description: Domain can resolve. Neu bo trong backend dung Host header.
      responses:
        "200":
          description: Capabilities duoc boc trong envelope API
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          capabilities:
                            $ref: "#/components/schemas/ZoneCapabilities"
                          domain:
                            type: string
                          zone:
                            $ref: "#/components/schemas/ZoneSummary"
  /api/v1/zones/claims:
    post:
      summary: Claim domain và tạo zone ở trạng thái chờ xác minh DNS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainClaimRequest"
      responses:
        "201":
          description: Domain claim đã được tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DomainClaim"
  /api/v1/zones/claims/{domain_id}:
    get:
      summary: Xem trạng thái claim domain của user hiện tại
      parameters:
        - $ref: "#/components/parameters/DomainID"
      responses:
        "200":
          description: Trạng thái domain claim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DomainClaim"
  /api/v1/zones/claims/{domain_id}/verify:
    post:
      summary: Kiểm tra DNS TXT và provision customer zone
      parameters:
        - $ref: "#/components/parameters/DomainID"
      responses:
        "200":
          description: Domain đã xác minh và zone đã sẵn sàng
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          discovery:
                            $ref: "#/components/schemas/ZoneDiscovery"
  /api/v1/zones/current:
    get:
      summary: Lay control-plane overview cua zone hien tai
      responses:
        "200":
          description: Zone, domains va deployments
    patch:
      summary: Cap nhat ten hoac registration mode cua zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateZoneRequest"
      responses:
        "200":
          description: Zone da duoc cap nhat
  /api/v1/zones/current/logo:
    post:
      summary: Upload logo của host vào object storage riêng
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [logo]
              properties:
                logo:
                  type: string
                  format: binary
      responses:
        "201":
          description: Logo đã được lưu; dùng logo_path để cập nhật zone
  /api/v1/branding/{zone_id}/{file_name}:
    get:
      summary: Đọc logo công khai của host từ object storage
      security: []
      parameters:
        - name: zone_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: file_name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Nội dung ảnh logo
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          description: Không tìm thấy logo
  /api/v1/zones/current/storage:
    get:
      summary: Lấy cấu hình object storage riêng của host hiện tại
      responses:
        "200":
          description: Cấu hình đã che Secret Key
    put:
      summary: Kiểm tra kết nối và lưu cấu hình MinIO/S3 riêng cho host
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateZoneStorageRequest"
      responses:
        "200":
          description: Kết nối thành công và cấu hình đã được mã hóa để lưu
        "400":
          description: Cấu hình không hợp lệ hoặc không kết nối được bucket
  /api/v1/users/me/avatar:
    post:
      summary: Upload ảnh đại diện vào object storage riêng của host
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        "201":
          description: Ảnh đã lưu; avatar_path dùng để cập nhật hồ sơ
        "409":
          description: Chưa chấp nhận phiên bản Terms và Privacy Policy hiện hành
  /api/v1/users/avatars/{zone_id}/{user_id}/{file_name}:
    get:
      summary: Đọc ảnh đại diện công khai từ object storage của host
      security: []
      parameters:
        - name: zone_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: user_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: file_name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Nội dung ảnh đại diện
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "404":
          description: Không tìm thấy ảnh đại diện
  /api/v1/zones/current/lifecycle:
    post:
      summary: Suspend, resume hoac archive zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [suspend, resume, archive]
                reason:
                  type: string
                  maxLength: 500
      responses:
        "204":
          description: Trang thai zone da duoc cap nhat va session da bi revoke khi can
  /api/v1/zones/current/domains:
    post:
      summary: Tao them domain claim trong zone hien tai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                kind:
                  type: string
                  enum: [alias, web, api]
      responses:
        "201":
          description: Domain claim da duoc tao
  /api/v1/zones/current/domains/{domain_id}:
    parameters:
      - $ref: "#/components/parameters/DomainID"
    delete:
      summary: Xoa domain phu khoi zone
      responses:
        "204":
          description: Domain da bi vo hieu hoa
  /api/v1/zones/current/domains/{domain_id}/primary:
    parameters:
      - $ref: "#/components/parameters/DomainID"
    post:
      summary: Chuyen domain da xac minh thanh primary
      responses:
        "204":
          description: Primary domain da duoc cap nhat
  /api/v1/zones/current/deployment-requests:
    get:
      summary: Danh sach yeu cau deployment cua zone
      responses:
        "200":
          description: Danh sach deployment request
    post:
      summary: Tao yeu cau chuyen deployment mode
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateZoneDeploymentRequest"
      responses:
        "201":
          description: Deployment request da duoc ghi ben vung
  /api/v1/zones/current/quota:
    get:
      summary: Lay quota va usage hien tai cua zone
      responses:
        "200":
          description: Quota va usage cua zone
    put:
      summary: Thay the quota cua zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneQuota"
      responses:
        "200":
          description: Quota da duoc cap nhat
        "409":
          description: Hard quota moi thap hon usage hien tai
  /api/v1/zones/current/oidc-providers:
    get:
      summary: Danh sach OIDC provider config cua zone
      responses:
        "200":
          description: Danh sach provider, khong tra secret reference value
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          oidc_providers:
                            type: array
                            items:
                              $ref: "#/components/schemas/ZoneOIDCProvider"
    post:
      summary: Tao OIDC provider config cho zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOIDCProviderRequest"
      responses:
        "201":
          description: OIDC provider config da duoc tao
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          oidc_provider:
                            $ref: "#/components/schemas/ZoneOIDCProvider"
  /api/v1/zones/current/oidc-providers/{provider_id}:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Cap nhat OIDC provider config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOIDCProviderRequest"
      responses:
        "200":
          description: OIDC provider config da duoc cap nhat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          oidc_provider:
                            $ref: "#/components/schemas/ZoneOIDCProvider"
    delete:
      summary: Xoa OIDC provider config
      responses:
        "204":
          description: OIDC provider config da duoc soft-delete
  /api/v1/zones/current/automation-templates:
    get:
      summary: Danh sách automation template phù hợp với loại zone hiện tại
      responses:
        "200":
          description: Danh sách template
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          templates:
                            type: array
                            items:
                              $ref: "#/components/schemas/AutomationTemplate"
  /api/v1/zones/current/automation-installations:
    get:
      summary: Danh sách automation installation của zone hiện tại
      responses:
        "200":
          description: Danh sách installation
    post:
      summary: Cài automation theo cấu hình riêng của zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAutomationInstallationRequest"
      responses:
        "201":
          description: Automation installation đã được tạo
  /api/v1/zones/current/automation-installations/{installation_id}:
    parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Cập nhật cấu hình hoặc trạng thái automation trong zone hiện tại
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutomationInstallationRequest"
      responses:
        "200":
          description: Automation installation đã được cập nhật
    delete:
      summary: Gỡ automation khỏi zone hiện tại
      responses:
        "204":
          description: Automation installation đã được soft-delete
  /api/v1/ws:
    get:
      summary: Kết nối WebSocket realtime
      description: >-
        Kết nối WebSocket realtime. Native client xác thực bằng Authorization
        Bearer header. Browser dùng một subprotocol webtui.jwt.{access_token}
        vì WebSocket API không cho đặt Authorization. Token trong query string
        bị từ chối để tránh rò rỉ qua access log và history. Sau khi kết nối,
        client gửi JSON join room workspace/channel
        để nhận event của channel.
      parameters:
        - name: Sec-WebSocket-Protocol
          in: header
          required: false
          schema:
            type: string
          description: Browser gửi đúng một subprotocol webtui.jwt.{access_token}.
      responses:
        "101":
          description: Nâng cấp kết nối WebSocket thành công
        "401":
          description: Thiếu hoặc sai access token
  /api/v1/calls/ice-servers:
    get:
      tags: [Calls]
      summary: Lấy cấu hình STUN/TURN cho WebRTC
      description: >-
        Trả về STUN public và TURN REST credentials ngắn hạn, được tạo riêng
        cho user hiện tại. Client không được cache quá expires_at.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Danh sách ICE server và thời điểm hết hạn credential
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ice_servers, expires_at]
                        properties:
                          ice_servers:
                            type: array
                            items:
                              type: object
                              required: [urls]
                              properties:
                                urls:
                                  oneOf:
                                    - type: string
                                      format: uri
                                    - type: array
                                      items:
                                        type: string
                                        format: uri
                                username:
                                  type: string
                                credential:
                                  type: string
                          expires_at:
                            type: string
                            format: date-time
        "401":
          description: Chưa xác thực
  /api/v1/public/conversations/{public_token}:
    get:
      security: []
      tags: [Channels]
      summary: Read public room metadata without revealing its media room key
      parameters:
        - name: public_token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public room metadata. meeting_room_key is omitted until an accepted guest grant is presented.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PublicConversationRoom"
        "404":
          description: Link is unknown, disabled, or expired
  /api/v1/public/conversations/{public_token}/join:
    post:
      security: []
      tags: [Channels]
      summary: Request a guest grant after explicit current legal acceptance
      parameters:
        - name: public_token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicGuestJoinRequest"
      responses:
        "201":
          description: Guest grant created; the private media key is returned only for an immediately approved grant
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GuestJoinRequest"
        "409":
          description: Current Terms/AUP and Privacy acceptance is missing
  /api/v1/public/conversations/{public_token}/join/{request_id}:
    get:
      security: []
      tags: [Channels]
      summary: Poll a guest grant using its opaque access token
      parameters:
        - name: public_token
          in: path
          required: true
          schema:
            type: string
        - name: request_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: access_token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current grant status; the media room key is returned only for an unexpired approved grant with current legal evidence
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/GuestJoinRequest"
        "409":
          description: Legacy or stale guest grant has no current legal evidence and cannot reveal the media room
  /api/v1/auth/legal-documents:
    get:
      security: []
      tags: [Auth]
      summary: Current legal document versions accepted by registration clients
      responses:
        "200":
          description: Current Terms/AUP and Privacy Policy versions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [documents]
                        properties:
                          documents:
                            type: array
                            items:
                              $ref: "#/components/schemas/LegalDocumentVersion"
  /api/v1/auth/legal-acceptance:
    get:
      tags: [Auth]
      summary: Read the authenticated user's acceptance of the current legal documents
      parameters:
        - name: workspace_id
          in: query
          required: false
          description: Workspace to inspect. Defaults to the workspace embedded in the access token for backward compatibility.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current per-workspace legal acceptance status; no consent is inferred or backfilled
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [legal_acceptance]
                        properties:
                          legal_acceptance:
                            $ref: "#/components/schemas/CurrentLegalAcceptance"
        "403":
          description: The actor is not an active member of the requested workspace, or the workspace is outside the token zone.
    post:
      tags: [Auth]
      summary: Accept the current Terms/AUP and Privacy Policy for an authorized workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LegalAcceptanceRequest"
      responses:
        "200":
          description: Both current acceptances were recorded with server timestamp and request metadata
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [legal_acceptance]
                        properties:
                          legal_acceptance:
                            $ref: "#/components/schemas/CurrentLegalAcceptance"
        "409":
          description: Both acceptance booleans must be true
        "403":
          description: The actor is not an active member of the requested workspace, or the workspace is outside the token zone.
  /api/v1/auth/register:
    post:
      security: []
      summary: Đăng ký user mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Tài khoản chưa được tạo vì thiếu chấp nhận tài liệu pháp lý hiện hành
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                success: false
                error:
                  code: LEGAL_ACCEPTANCE_REQUIRED
                  message: Accept the current Terms, Acceptable Use Policy, and Privacy Policy before creating an account.
  /api/v1/auth/login:
    post:
      security: []
      summary: Đăng nhập bằng email hoặc username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/google:
    post:
      security: []
      summary: Đăng nhập hoặc đăng ký bằng Google Identity Services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: Xác thực Google thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: Google identity hợp lệ nhưng sẽ tạo tài khoản mới và cần consent; giữ credential rồi retry với bốn field legal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                success: false
                error:
                  code: LEGAL_ACCEPTANCE_REQUIRED
                  message: Accept the current Terms, Acceptable Use Policy, and Privacy Policy before creating an account.
  /api/v1/auth/oidc/providers:
    get:
      security: []
      summary: List runtime-ready OIDC providers for one zone domain
      parameters:
        - name: domain
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Public provider identifiers and display names
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [oidc_providers]
                        properties:
                          oidc_providers:
                            type: array
                            items:
                              $ref: "#/components/schemas/PublicOIDCProvider"
  /api/v1/auth/oidc/start:
    post:
      security: []
      summary: Start an OIDC authorization-code flow with PKCE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCStartRequest"
      responses:
        "200":
          description: IdP authorization URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OIDCStartResult"
  /api/v1/auth/oidc/callback:
    get:
      security: []
      summary: Verify the IdP callback and redirect with a one-time completion code
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Same-origin redirect to return_to with oidc_code or oidc_error
  /api/v1/auth/oidc/complete:
    post:
      security: []
      summary: Exchange a one-time OIDC completion code for a VPSTTT session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCCompleteRequest"
      responses:
        "200":
          description: VPSTTT access and refresh session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "409":
          description: New-account OIDC JIT is fail-closed until versioned legal acceptance is carried end-to-end; existing/pre-provisioned accounts remain supported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
              example:
                success: false
                error:
                  code: OIDC_JIT_LEGAL_ACCEPTANCE_REQUIRED
                  message: OIDC cannot create a new account until the user completes the required legal acceptance flow. Pre-provision the account or use standard registration first.
  /api/v1/auth/refresh:
    post:
      security: []
      summary: Rotate refresh token và cấp access token mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/logout:
    post:
      security: []
      summary: Thu hồi refresh token hiện tại
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Logout thành công
  /api/v1/auth/me:
    get:
      summary: Lấy user hiện tại từ access token
      responses:
        "200":
          description: Thông tin user hiện tại
  /api/v1/auth/sessions:
    get:
