    RegisterRequest:
      type: object
      required: [email, username, display_name, password, terms_accepted, terms_version, privacy_accepted, privacy_version]
      properties:
        terms_accepted:
          type: boolean
          const: true
          description: Must be true for every new account.
        terms_version:
          type: string
          example: "2026-08-07"
          description: Current Terms and Acceptable Use Policy version from /api/v1/auth/legal-documents.
        privacy_accepted:
          type: boolean
          const: true
          description: Must be true for every new account and records acknowledgement of the current Privacy Policy.
        privacy_version:
          type: string
          example: "2026-08-07"
        email:
          type: string
          format: email
        username:
          type: string
        display_name:
          type: string
        domain:
          type: string
          description: Tùy chọn cho control plane dùng chung. Instance self-hosted luôn dùng INSTANCE_DOMAIN đã cấu hình.
          example: chat.customer.example
        invite_token:
          type: string
          description: Bắt buộc khi zone dùng registration_mode=invite_only.
        password:
          type: string
          format: password
        device_name:
          type: string
          description: Tùy chọn. Nếu không gửi, backend tự suy ra từ User-Agent.
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: Email hoặc username
        password:
          type: string
          format: password
        domain:
          type: string
          description: Tùy chọn cho control plane dùng chung; instance self-hosted dùng INSTANCE_DOMAIN.
          example: chat.customer.example
        device_name:
          type: string
          description: Tùy chọn. Nếu không gửi, backend tự suy ra từ User-Agent.
    GoogleLoginRequest:
