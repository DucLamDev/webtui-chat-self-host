                          sessions:
                            type: array
                            items:
                              $ref: "#/components/schemas/AuthSession"
    delete:
      summary: Thu hồi toàn bộ phiên đăng nhập của user hiện tại
      responses:
        "204":
          description: Đã thu hồi
  /api/v1/auth/sessions/{session_id}:
    delete:
      summary: Thu hồi một phiên đăng nhập
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Đã thu hồi
  /api/v1/mobile/devices:
    get:
      summary: Danh sách thiết bị nhận push của user hiện tại
      responses:
        "200":
          description: Danh sách thiết bị
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          devices:
                            type: array
                            items:
                              $ref: "#/components/schemas/PushDevice"
    post:
      summary: Đăng ký hoặc cập nhật thiết bị mobile/desktop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceUpsertRequest"
      responses:
        "201":
          description: Thiết bị đã được đăng ký
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PushDevice"
  /api/v1/mobile/devices/{device_id}:
    patch:
      summary: Cập nhật thiết bị push theo device_id
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceUpsertRequest"
      responses:
        "200":
          description: Thiết bị đã được cập nhật
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PushDevice"
    delete:
      summary: Thu hồi thiết bị push theo device_id
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Thiết bị đã được thu hồi
  /api/v1/users/me:
    get:
      summary: Lấy hồ sơ user hiện tại
      responses:
        "200":
          description: Hồ sơ user
    patch:
      summary: Cập nhật hồ sơ user hiện tại
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Hồ sơ đã cập nhật
        "409":
          description: Chưa chấp nhận phiên bản Terms và Privacy Policy hiện hành
    delete:
      summary: Xóa vĩnh viễn tài khoản của user hiện tại
      description: >-
        Xóa tài khoản, phiên đăng nhập, push token và dữ liệu cá nhân liên kết.
        Nội dung thuộc hồ sơ của tổ chức như tin nhắn có thể được giữ lại nhưng
        không còn liên kết tới hồ sơ người dùng. User đang sở hữu workspace phải
        chuyển quyền sở hữu trước để không làm instance rơi vào trạng thái có
        thể bị người đăng ký kế tiếp chiếm quyền.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  enum: [DELETE]
                ownership_successor_email:
                  type: string
                  format: email
                  description: >-
                    Bắt buộc khi user còn sở hữu workspace. Tài khoản đích phải
                    active và là thành viên của mọi workspace đang được chuyển.
      responses:
        "204":
          description: Tài khoản đã được xóa
        "400":
          description: Thiếu xác nhận DELETE
        "401":
          description: Phiên đăng nhập không hợp lệ
        "409":
          description: Thiếu hoặc không hợp lệ người kế nhiệm quyền sở hữu workspace
  /api/v1/users:
    get:
      summary: Danh sách user
      description: >-
        User có `user.manage` trong một workspace active của zone được xem directory
        toàn zone. User thông thường chỉ thấy tài khoản có ít nhất một workspace
        active chung trong zone. Metadata IP và thiết bị chỉ trả cho chính chủ hoặc
        user quản trị.
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Danh sách user
  /api/v1/users/{user_id}:
    get:
      summary: Xem hồ sơ user theo id
      description: >-
        Chỉ trả user thuộc zone hiện tại khi actor là chính user, có `user.manage`
        trong zone, hoặc có ít nhất một workspace active chung với user đích.
        Tài khoản không nằm trong scope trả 404 để tránh dò ID.
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Hồ sơ user
  /api/v1/rbac/permissions:
