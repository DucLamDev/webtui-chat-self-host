          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Danh sách backup run
  /api/v1/workspaces/{workspace_id}/backup-jobs/{backup_job_id}/run:
    post:
      summary: Chạy backup job thủ công
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/BackupJobID"
      responses:
        "201":
          description: Backup run đã được tạo
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DomainID:
      name: domain_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartmentID:
      name: department_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelID:
      name: channel_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageID:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileID:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    APITokenID:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BotID:
      name: bot_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookID:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationID:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CronJobID:
      name: cronjob_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketID:
      name: ticket_id
