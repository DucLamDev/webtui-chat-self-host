openapi: 3.1.0
info:
  title: WebTui Chat Backend API
  version: 0.9.0
  description: Contract nền cho backend WebTui Chat. Tài liệu API được cập nhật theo từng phase backend.
servers:
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      summary: Kiểm tra API còn sống
      responses:
        "200":
          description: API đang hoạt động
  /ready:
    get:
      security: []
      summary: Kiểm tra API sẵn sàng nhận traffic
      responses:
        "200":
          description: API sẵn sàng
  /version:
    get:
      security: []
      summary: Thông tin phiên bản backend
      responses:
        "200":
          description: Thông tin phiên bản
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
  /desktop/releases/{channel}/{target}/{arch}/{current_version}:
    get:
      security: []
      summary: Manifest signed updater cho desktop app
      description: Trả manifest Tauri updater đã publish theo channel/target/arch. Trả 204 khi chưa cấu hình hoặc chưa có bản mới.
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum: [stable, beta]
        - name: target
          in: path
          required: true
          schema:
            type: string
            example: windows-x86_64
        - name: arch
          in: path
          required: true
          schema:
            type: string
            example: x86_64
        - name: current_version
          in: path
          required: true
          schema:
            type: string
            example: 0.1.0
      responses:
        "200":
          description: Manifest có bản cập nhật signed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DesktopUpdaterManifest"
        "204":
          description: Không có bản cập nhật hoặc chưa cấu hình manifest
  /mobile/releases/{platform}/{channel}/{current_version}:
    get:
      security: []
      summary: Metadata phiên bản mobile app
      description: Trả manifest mobile nếu đã publish, hoặc policy fallback từ cấu hình backend.
      parameters:
        - name: platform
          in: path
          required: true
          schema:
            type: string
            enum: [android, ios]
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum: [stable, beta, internal]
        - name: current_version
          in: path
          required: true
          schema:
            type: string
            example: 1.0.0
      responses:
        "200":
          description: Metadata hoặc manifest phiên bản mobile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MobileReleaseManifest"
        "204":
          description: Chưa có manifest mobile phù hợp
  /downloads/manifest/{channel}:
    get:
      security: []
      summary: Manifest public cho file download
      description: Dùng cho APK/Desktop direct download để mobile/web kiểm tra checksum trước khi tải.
      parameters:
        - name: channel
          in: path
          required: true
          schema:
            type: string
            enum: [stable, beta, internal]
      responses:
        "200":
          description: Manifest download public
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadManifest"
        "204":
          description: Chưa cấu hình download manifest
  /metrics:
    get:
      security: []
      summary: Metrics Prometheus của API
      description: Bật bằng `METRICS_ENABLED=true`, trả metric kỹ thuật dạng text/plain.
      responses:
        "200":
          description: Metrics Prometheus
          content:
            text/plain:
              schema:
                type: string
  /api:
    get:
      security: []
      summary: Entry point API tren cung domain voi web
      description: Tra thong tin API; cac endpoint nghiep vu nam duoi `/api/v1`.
      responses:
        "200":
          description: API hoat dong
  /api/v1:
    get:
      security: []
      summary: Thông tin API v1
      responses:
        "200":
          description: API v1 hoạt động
  /.well-known/vpsttt-chat:
    get:
      security: []
      summary: Discovery public theo domain
      description: Client domain-first goi endpoint nay tren domain cua zone de lay runtime URL va capabilities.
      responses:
        "200":
          description: Thong tin discovery cua zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneDiscovery"
  /api/v1/discovery:
    get:
      security: []
      summary: Resolve domain thanh zone chat
      parameters:
        - name: domain
          in: query
          required: false
          schema:
            type: string
          description: Domain can resolve. Neu bo trong backend dung Host header.
      responses:
        "200":
          description: Discovery duoc boc trong envelope API
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          discovery:
                            $ref: "#/components/schemas/ZoneDiscovery"
  /api/v1/capabilities:
    get:
      security: []
      summary: Capabilities public cua zone
      parameters:
        - name: domain
          in: query
          required: false
          schema:
            type: string
          description: Domain can resolve. Neu bo trong backend dung Host header.
      responses:
        "200":
          description: Capabilities duoc boc trong envelope API
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          capabilities:
                            $ref: "#/components/schemas/ZoneCapabilities"
                          domain:
                            type: string
                          zone:
                            $ref: "#/components/schemas/ZoneSummary"
  /api/v1/zones/claims:
    post:
      summary: Claim domain và tạo zone ở trạng thái chờ xác minh DNS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDomainClaimRequest"
      responses:
        "201":
          description: Domain claim đã được tạo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DomainClaim"
  /api/v1/zones/claims/{domain_id}:
    get:
      summary: Xem trạng thái claim domain của user hiện tại
      parameters:
        - $ref: "#/components/parameters/DomainID"
      responses:
        "200":
          description: Trạng thái domain claim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/DomainClaim"
  /api/v1/zones/claims/{domain_id}/verify:
    post:
      summary: Kiểm tra DNS TXT và provision customer zone
      parameters:
        - $ref: "#/components/parameters/DomainID"
      responses:
        "200":
          description: Domain đã xác minh và zone đã sẵn sàng
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          discovery:
                            $ref: "#/components/schemas/ZoneDiscovery"
  /api/v1/zones/current:
    get:
      summary: Lay control-plane overview cua zone hien tai
      responses:
        "200":
          description: Zone, domains va deployments
    patch:
      summary: Cap nhat ten hoac registration mode cua zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateZoneRequest"
      responses:
        "200":
          description: Zone da duoc cap nhat
  /api/v1/zones/current/lifecycle:
    post:
      summary: Suspend, resume hoac archive zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [suspend, resume, archive]
                reason:
                  type: string
                  maxLength: 500
      responses:
        "204":
          description: Trang thai zone da duoc cap nhat va session da bi revoke khi can
  /api/v1/zones/current/domains:
    post:
      summary: Tao them domain claim trong zone hien tai
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain:
                  type: string
                kind:
                  type: string
                  enum: [alias, web, api]
      responses:
        "201":
          description: Domain claim da duoc tao
  /api/v1/zones/current/domains/{domain_id}:
    parameters:
      - $ref: "#/components/parameters/DomainID"
    delete:
      summary: Xoa domain phu khoi zone
      responses:
        "204":
          description: Domain da bi vo hieu hoa
  /api/v1/zones/current/domains/{domain_id}/primary:
    parameters:
      - $ref: "#/components/parameters/DomainID"
    post:
      summary: Chuyen domain da xac minh thanh primary
      responses:
        "204":
          description: Primary domain da duoc cap nhat
  /api/v1/zones/current/deployment-requests:
    get:
      summary: Danh sach yeu cau deployment cua zone
      responses:
        "200":
          description: Danh sach deployment request
    post:
      summary: Tao yeu cau chuyen deployment mode
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateZoneDeploymentRequest"
      responses:
        "201":
          description: Deployment request da duoc ghi ben vung
  /api/v1/zones/current/quota:
    get:
      summary: Lay quota va usage hien tai cua zone
      responses:
        "200":
          description: Quota va usage cua zone
    put:
      summary: Thay the quota cua zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneQuota"
      responses:
        "200":
          description: Quota da duoc cap nhat
        "409":
          description: Hard quota moi thap hon usage hien tai
  /api/v1/zones/current/oidc-providers:
    get:
      summary: Danh sach OIDC provider config cua zone
      responses:
        "200":
          description: Danh sach provider, khong tra secret reference value
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          oidc_providers:
                            type: array
                            items:
                              $ref: "#/components/schemas/ZoneOIDCProvider"
    post:
      summary: Tao OIDC provider config cho zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOIDCProviderRequest"
      responses:
        "201":
          description: OIDC provider config da duoc tao
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          oidc_provider:
                            $ref: "#/components/schemas/ZoneOIDCProvider"
  /api/v1/zones/current/oidc-providers/{provider_id}:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Cap nhat OIDC provider config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOIDCProviderRequest"
      responses:
        "200":
          description: OIDC provider config da duoc cap nhat
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          oidc_provider:
                            $ref: "#/components/schemas/ZoneOIDCProvider"
    delete:
      summary: Xoa OIDC provider config
      responses:
        "204":
          description: OIDC provider config da duoc soft-delete
  /api/v1/zones/current/automation-templates:
    get:
      summary: Danh sách automation template phù hợp với loại zone hiện tại
      responses:
        "200":
          description: Danh sách template
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          templates:
                            type: array
                            items:
                              $ref: "#/components/schemas/AutomationTemplate"
  /api/v1/zones/current/automation-installations:
    get:
      summary: Danh sách automation installation của zone hiện tại
      responses:
        "200":
          description: Danh sách installation
    post:
      summary: Cài automation theo cấu hình riêng của zone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAutomationInstallationRequest"
      responses:
        "201":
          description: Automation installation đã được tạo
  /api/v1/zones/current/automation-installations/{installation_id}:
    parameters:
      - name: installation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Cập nhật cấu hình hoặc trạng thái automation trong zone hiện tại
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAutomationInstallationRequest"
      responses:
        "200":
          description: Automation installation đã được cập nhật
    delete:
      summary: Gỡ automation khỏi zone hiện tại
      responses:
        "204":
          description: Automation installation đã được soft-delete
  /api/v1/ws:
    get:
      summary: Kết nối WebSocket realtime
      description: >-
        Kết nối WebSocket realtime. Client có thể xác thực bằng header
        `Authorization: Bearer {access_token}`, query `access_token={access_token}`
        hoặc browser subprotocol `["webtui.jwt", accessToken]`. Sau khi kết nối,
        client gửi JSON `{"type":"join","room":"workspace:{workspace_id}:channel:{channel_id}"}`
        để nhận event của channel.
      parameters:
        - name: access_token
          in: query
          required: false
          schema:
            type: string
          description: Access token JWT cho browser WebSocket khi không set được header Authorization.
        - name: Sec-WebSocket-Protocol
          in: header
          required: false
          schema:
            type: string
          description: Có thể gửi `webtui.jwt, {access_token}` bằng WebSocket subprotocol.
      responses:
        "101":
          description: Nâng cấp kết nối WebSocket thành công
  /api/v1/auth/register:
    post:
      security: []
      summary: Đăng ký user mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/login:
    post:
      security: []
      summary: Đăng nhập bằng email hoặc username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/google:
    post:
      security: []
      summary: Đăng nhập hoặc đăng ký bằng Google Identity Services
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleLoginRequest"
      responses:
        "200":
          description: Xác thực Google thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/oidc/providers:
    get:
      security: []
      summary: List runtime-ready OIDC providers for one zone domain
      parameters:
        - name: domain
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Public provider identifiers and display names
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [oidc_providers]
                        properties:
                          oidc_providers:
                            type: array
                            items:
                              $ref: "#/components/schemas/PublicOIDCProvider"
  /api/v1/auth/oidc/start:
    post:
      security: []
      summary: Start an OIDC authorization-code flow with PKCE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCStartRequest"
      responses:
        "200":
          description: IdP authorization URL
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/OIDCStartResult"
  /api/v1/auth/oidc/callback:
    get:
      security: []
      summary: Verify the IdP callback and redirect with a one-time completion code
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
      responses:
        "303":
          description: Same-origin redirect to return_to with oidc_code or oidc_error
  /api/v1/auth/oidc/complete:
    post:
      security: []
      summary: Exchange a one-time OIDC completion code for a VPSTTT session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OIDCCompleteRequest"
      responses:
        "200":
          description: VPSTTT access and refresh session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/refresh:
    post:
      security: []
      summary: Rotate refresh token và cấp access token mới
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refresh thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
  /api/v1/auth/logout:
    post:
      security: []
      summary: Thu hồi refresh token hiện tại
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Logout thành công
  /api/v1/auth/me:
    get:
      summary: Lấy user hiện tại từ access token
      responses:
        "200":
          description: Thông tin user hiện tại
  /api/v1/auth/sessions:
    get:
      summary: Danh sách phiên đăng nhập của user hiện tại
      responses:
        "200":
          description: Danh sách phiên
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sessions:
                            type: array
                            items:
                              $ref: "#/components/schemas/AuthSession"
    delete:
      summary: Thu hồi toàn bộ phiên đăng nhập của user hiện tại
      responses:
        "204":
          description: Đã thu hồi
  /api/v1/auth/sessions/{session_id}:
    delete:
      summary: Thu hồi một phiên đăng nhập
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Đã thu hồi
  /api/v1/mobile/devices:
    get:
      summary: Danh sách thiết bị nhận push của user hiện tại
      responses:
        "200":
          description: Danh sách thiết bị
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          devices:
                            type: array
                            items:
                              $ref: "#/components/schemas/PushDevice"
    post:
      summary: Đăng ký hoặc cập nhật thiết bị mobile/desktop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceUpsertRequest"
      responses:
        "201":
          description: Thiết bị đã được đăng ký
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PushDevice"
  /api/v1/mobile/devices/{device_id}:
    patch:
      summary: Cập nhật thiết bị push theo device_id
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushDeviceUpsertRequest"
      responses:
        "200":
          description: Thiết bị đã được cập nhật
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ApiResponse"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/PushDevice"
    delete:
      summary: Thu hồi thiết bị push theo device_id
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
            maxLength: 128
      responses:
        "204":
          description: Thiết bị đã được thu hồi
  /api/v1/users/me:
    get:
      summary: Lấy hồ sơ user hiện tại
      responses:
        "200":
          description: Hồ sơ user
    patch:
      summary: Cập nhật hồ sơ user hiện tại
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Hồ sơ đã cập nhật
  /api/v1/users:
    get:
      summary: Danh sách user
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Danh sách user
  /api/v1/users/{user_id}:
    get:
      summary: Xem hồ sơ user theo id
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Hồ sơ user
