  /api/v1/workspaces/{workspace_id}/backup-jobs/{backup_job_id}/run:
    post:
      summary: Chạy backup job thủ công
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/BackupJobID"
      responses:
        "201":
          description: Backup run đã được tạo
  /api/v1/workspaces/{workspace_id}/messages/scheduled:
    get:
      summary: List scheduled messages
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Scheduled messages
    post:
      summary: Schedule a message
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body, scheduled_for]
              properties:
                body: { type: string }
                scheduled_for: { type: string, format: date-time }
                silent: { type: boolean }
      responses:
        "201":
          description: Message scheduled
  /api/v1/workspaces/{workspace_id}/messages/reminders:
    get:
      summary: List message reminders
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Message reminders
  /api/v1/workspaces/{workspace_id}/files/uploads:
    post:
      summary: Create a resumable file upload
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [original_name, mime_type, total_size]
              properties:
                original_name: { type: string }
                mime_type: { type: string }
                total_size: { type: integer, format: int64 }
                chunk_size: { type: integer, default: 5242880 }
      responses:
        "201":
          description: Upload session created
  /api/v1/workspaces/{workspace_id}/files/uploads/{upload_id}/parts/{part_number}:
    put:
      summary: Upload or retry one file chunk
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - name: upload_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: part_number
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
        - name: X-Chunk-SHA256
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "200":
          description: Chunk accepted
  /api/v1/workspaces/{workspace_id}/files/uploads/{upload_id}/complete:
    post:
      summary: Assemble and finalize a resumable upload
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - name: upload_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: File finalized
  /api/v1/workspaces/{workspace_id}/talk/home:
    get:
      summary: Talk Home dashboard
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Meetings, voice rooms, tasks, reminders and missed calls
  /api/v1/workspaces/{workspace_id}/talk/integrations:
    get:
      summary: Get self-hosted Talk capability flags
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Talk integration settings
    put:
      summary: Configure local AI, federation, SIP and bridge gates
      description: e2ee_calls_enabled is reserved and currently rejected until verified device key agreement is implemented.
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          description: Talk integration settings updated
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/collaboration/meetings:
    get:
      summary: List channel meetings
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Meetings
    post:
      summary: Schedule a channel meeting
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "201":
          description: Meeting scheduled
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/collaboration/voice-room:
    get:
      summary: Get the channel voice-room state
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Voice-room state
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/collaboration/breakouts/setup:
    put:
      summary: Prepare automatic, manual or self-select breakout rooms
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Prepared breakout rooms
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/collaboration/shared-items:
    get:
      summary: List shared files, pins, polls, tasks and recordings
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Shared items
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/collaboration/recording-policy:
    get:
      summary: Get recording consent and retention policy
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Recording policy
    put:
      summary: Update recording consent and retention policy
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Recording policy updated
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/collaboration/recordings:
    get:
      summary: List meeting recordings
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Recordings
    post:
      summary: Start recording consent flow
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "201":
          description: Recording lifecycle created
  /api/v1/workspaces/{workspace_id}/channels/{channel_id}/collaboration/ai/summary:
    post:
      summary: Summarize recent messages with self-hosted Ollama or LocalAI
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/ChannelID"
      responses:
        "200":
          description: Summary, decisions and action items
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    DomainID:
      name: domain_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserID:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DepartmentID:
      name: department_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChannelID:
      name: channel_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MessageID:
      name: message_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileID:
      name: file_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    APITokenID:
      name: token_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BotID:
      name: bot_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WebhookID:
      name: webhook_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationID:
      name: notification_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CronJobID:
      name: cronjob_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TicketID:
      name: ticket_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BackupJobID:
      name: backup_job_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ZoneDiscovery:
      type: object
      properties:
        version:
          type: string
        domain:
          type: string
        setup_required:
          type: boolean
          description: True when a self-hosted instance still needs its first owner account.
        zone:
          $ref: "#/components/schemas/ZoneSummary"
        workspace:
          $ref: "#/components/schemas/ZoneWorkspaceRef"
        runtime:
          $ref: "#/components/schemas/ZoneRuntime"
        capabilities:
          $ref: "#/components/schemas/ZoneCapabilities"
        deployment:
          $ref: "#/components/schemas/ZoneDeployment"
    ZoneSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        logo_url:
          type: string
        kind:
          type: string
          enum: [vpsttt_internal, customer_saas, customer_dedicated]
        status:
          type: string
          enum: [provisioning, active, suspended, archived]
        registration_mode:
          type: string
          enum: [open, invite_only, closed]
    ZoneWorkspaceRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    ZoneRuntime:
      type: object
      properties:
        app_name:
          type: string
        logo_url:
          type: string
        app_version:
          type: string
        release_channel:
          type: string
        locale:
          type: string
        web_base_url:
          type: string
          format: uri
        api_base_url:
          type: string
          format: uri
        ws_base_url:
          type: string
        admin_base_url:
          type: string
          format: uri
        rtc_ice_servers:
          type: array
          items:
            type: object
            required: [urls]
            properties:
              urls:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
              username:
                type: string
              credential:
                type: string
    ZoneCapabilities:
      type: object
      properties:
        chat:
          type: boolean
        files:
          type: boolean
        calls:
          type: boolean
        bots:
          type: boolean
        automation:
          type: boolean
        webhooks:
          type: boolean
        federation:
          type: boolean
        sso:
          type: boolean
          description: Chi true khi OIDC login verifier da duoc deploy.
        oidc_configuration:
          type: boolean
          description: Control-plane API ho tro luu OIDC provider contract.
        custom_domain:
          type: boolean
        dedicated:
          type: boolean
        self_hosted:
          type: boolean
          description: Instance này do customer tự vận hành trên hạ tầng riêng.
    ZoneDeployment:
      type: object
      properties:
        mode:
          type: string
          enum: [shared, dedicated_compose, dedicated_k8s]
        database_mode:
          type: string
          enum: [shared_schema, dedicated_schema, dedicated_database]
        status:
          type: string
          enum: [provisioning, ready, failed, suspended]
    CreateDomainClaimRequest:
      type: object
      required: [domain, zone_name]
      properties:
        domain:
          type: string
          example: chat.customer.example
        zone_name:
          type: string
        registration_mode:
          type: string
          enum: [open, invite_only, closed]
          default: invite_only
    DomainClaim:
      type: object
      required: [id, domain, status, verification_method, verification_dns_name, verification_dns_value, zone]
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        status:
          type: string
          enum: [pending, verified, active, suspended]
        routing_dns_type:
          type: string
          enum: [A, AAAA]
          description: DNS record type used to route the customer domain to the VPSTTT edge.
        routing_dns_name:
          type: string
          description: DNS host that the customer must route to the VPSTTT edge.
        routing_dns_value:
          type: string
          description: IPv4 or IPv6 address of the VPSTTT edge.
        verification_method:
          type: string
          enum: [dns_txt]
        verification_dns_name:
          type: string
        verification_dns_value:
          type: string
        verification_expires_at:
          type: string
          format: date-time
        verification_attempts:
          type: integer
        last_verification_error:
          type: string
        last_checked_at:
          type: string
          format: date-time
        zone:
          $ref: "#/components/schemas/ZoneSummary"
        workspace:
          $ref: "#/components/schemas/ZoneWorkspaceRef"
    UpdateZoneRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 120
        registration_mode:
          type: string
          enum: [open, invite_only, closed]
        logo_url:
          type: string
          maxLength: 2048
    ZoneStorageSettings:
      type: object
      required: [provider, has_secret_access_key, configured]
      properties:
        provider:
          type: string
          enum: [local, minio, s3]
        endpoint:
          type: string
          format: uri
        region:
          type: string
        bucket:
          type: string
        access_key_id:
          type: string
        has_secret_access_key:
          type: boolean
        configured:
          type: boolean
        updated_at:
          type: string
          format: date-time
    UpdateZoneStorageRequest:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          enum: [local, minio, s3]
        endpoint:
          type: string
          format: uri
        region:
          type: string
          default: us-east-1
        bucket:
          type: string
          minLength: 3
          maxLength: 63
        access_key_id:
          type: string
        secret_access_key:
          type: string
          format: password
          description: Bỏ trống khi muốn giữ Secret Key đã mã hóa hiện tại.
    CreateZoneDeploymentRequest:
      type: object
      required: [requested_mode, requested_database_mode]
      properties:
        requested_mode:
          type: string
          enum: [shared, dedicated_compose, dedicated_k8s]
        requested_database_mode:
          type: string
          enum: [shared_schema, dedicated_schema, dedicated_database]
    ZoneQuota:
      type: object
      properties:
        max_workspaces:
          type: integer
          minimum: 1
        max_members:
          type: integer
          minimum: 1
        max_storage_bytes:
          type: integer
          format: int64
          minimum: 1
        max_automation_installations:
          type: integer
          minimum: 1
        max_webhooks:
          type: integer
          minimum: 1
        enforcement_mode:
          type: string
          enum: [monitor, hard]
    ZoneOIDCProvider:
      type: object
      required:
        - id
        - zone_id
        - name
        - issuer_url
        - client_id
        - has_client_secret_ref
        - scopes
        - claim_mapping
        - jit_provisioning
        - require_verified_email
        - status
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        zone_id:
          type: string
          format: uuid
        name:
          type: string
        issuer_url:
          type: string
          format: uri
        client_id:
          type: string
        has_client_secret_ref:
          type: boolean
        scopes:
          type: array
          items:
            type: string
        claim_mapping:
          type: object
          additionalProperties:
            type: string
        jit_provisioning:
          type: boolean
        require_verified_email:
          type: boolean
        status:
          type: string
          enum: [configured, disabled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateOIDCProviderRequest:
      type: object
      required: [name, issuer_url, client_id]
      properties:
        name:
          type: string
          maxLength: 120
        issuer_url:
          type: string
          format: uri
        client_id:
          type: string
        client_secret_ref:
          type: string
          description: Reference den secret manager; API khong nhan client secret inline.
        scopes:
          type: array
          items:
            type: string
        claim_mapping:
          type: object
          additionalProperties:
            type: string
        jit_provisioning:
          type: boolean
          default: false
        require_verified_email:
          type: boolean
          default: true
        status:
          type: string
          enum: [configured, disabled]
    UpdateOIDCProviderRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 120
        issuer_url:
          type: string
          format: uri
        client_id:
          type: string
        client_secret_ref:
          type: string
        scopes:
          type: array
          items:
            type: string
        claim_mapping:
          type: object
          additionalProperties:
            type: string
        jit_provisioning:
          type: boolean
        require_verified_email:
          type: boolean
        status:
          type: string
          enum: [configured, disabled]
    AutomationTemplate:
      type: object
      required: [id, key, name, zone_kind, template_type, runtime_kind, config_schema, default_config, required_scopes, status]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        description:
          type: string
        zone_kind:
          type: string
          enum: [vpsttt_internal, customer_saas, customer_dedicated, any]
        template_type:
          type: string
          enum: [bot, workflow, connector]
        runtime_kind:
          type: string
          enum: [none, outgoing_webhook]
        config_schema:
          type: object
          additionalProperties: true
        default_config:
          type: object
          additionalProperties: true
        required_scopes:
          type: array
          items:
            type: string
        status:
          type: string
    CreateAutomationInstallationRequest:
      type: object
      required: [template_key, name]
      properties:
        workspace_id:
          type: string
          format: uuid
        template_key:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [enabled, disabled]
        config:
          type: object
          additionalProperties: true
        secret_ref:
          type: string
          description: Tham chiếu đến secret manager; không gửi credential trực tiếp trong config.
    UpdateAutomationInstallationRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        status:
          type: string
          enum: [enabled, disabled]
        config:
          type: object
          additionalProperties: true
        secret_ref:
          type: string
          description: Gửi chuỗi rỗng để xóa secret_ref; không gửi credential trực tiếp trong config.
    AutomationInstallation:
      type: object
      required: [id, zone_id, name, status, config, has_secret_ref, runtime_ready, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        zone_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        template_key:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [enabled, disabled, failed]
        config:
          type: object
          additionalProperties: true
        has_secret_ref:
          type: boolean
        runtime_webhook_id:
          type: string
          format: uuid
        runtime_ready:
          type: boolean
        runtime_secret:
          type: string
          writeOnly: true
          description: Chi co trong response create va chi hien thi mot lan.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          description: Dữ liệu trả về
        error:
          $ref: "#/components/schemas/ApiError"
        meta:
          description: Metadata phân trang hoặc thông tin bổ sung
        request_id:
          type: string
        timestamp:
          type: string
          format: date-time
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    VersionInfo:
      type: object
      properties:
        app:
          type: string
        env:
          type: string
        version:
          type: string
        clients:
          type: object
          properties:
            desktop:
              $ref: "#/components/schemas/DesktopVersionPolicy"
            mobile:
              $ref: "#/components/schemas/MobileVersionPolicy"
    DesktopVersionPolicy:
      type: object
      properties:
        minimum_version:
          type: string
          description: Minimum desktop app version allowed by this backend contract.
        recommended_version:
          type: string
          description: Recommended desktop app version for the current release channel.
        update_url:
          type: string
          format: uri
    DesktopUpdaterManifest:
      type: object
      required: [version, platforms]
      properties:
        version:
          type: string
        notes:
          type: string
        pub_date:
          type: string
          format: date-time
        platforms:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DesktopUpdaterPlatform"
    DesktopUpdaterPlatform:
      type: object
      required: [signature, url]
      properties:
        signature:
          type: string
        url:
          type: string
          format: uri
    MobileVersionPolicy:
      type: object
      properties:
        minimum_version:
          type: string
        recommended_version:
          type: string
        download_url:
          type: string
          format: uri
        store_url:
          type: string
          format: uri
    MobileReleaseManifest:
      type: object
      properties:
        platform:
          type: string
          enum: [android, ios]
        channel:
          type: string
          enum: [stable, beta, internal]
        current_version:
          type: string
        minimum_version:
          type: string
        recommended_version:
          type: string
        version:
          type: string
        required:
          type: boolean
        download_url:
          type: string
          format: uri
        store_url:
          type: string
          format: uri
        checksum_sha256:
          type: string
        notes:
          type: string
    DownloadManifest:
      type: object
      properties:
        channel:
          type: string
        files:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              url:
                type: string
                format: uri
              byte_size:
                type: integer
              checksum_sha256:
                type: string
    SendMessageRequest:
      type: object
      required: [body]
      properties:
        parent_id:
          type: string
          format: uuid
          description: Tin nhắn cha khi reply thread.
        client_message_id:
          type: string
          maxLength: 128
          description: Optional client-generated idempotency key. Also stored in metadata.
        kind:
          type: string
          default: text
          enum: [text, file, event]
        body:
          type: string
        metadata:
          type: object
          additionalProperties: true
        mentioned_user_ids:
          type: array
          items:
            type: string
            format: uuid
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        channel_id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
        thread_root_id:
          type: string
          format: uuid
        kind:
          type: string
        body:
          type: string
        metadata:
          type: object
          additionalProperties: true
        mentions:
          type: array
          items:
            type: string
            format: uuid
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ReactionSummary"
        created_at:
