          $ref: "#/components/schemas/ZoneWorkspaceRef"
        runtime:
          $ref: "#/components/schemas/ZoneRuntime"
        capabilities:
          $ref: "#/components/schemas/ZoneCapabilities"
        deployment:
          $ref: "#/components/schemas/ZoneDeployment"
    ZoneSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [vpsttt_internal, customer_saas, customer_dedicated]
        status:
          type: string
          enum: [provisioning, active, suspended, archived]
        registration_mode:
          type: string
          enum: [open, invite_only, closed]
    ZoneWorkspaceRef:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
    ZoneRuntime:
      type: object
      properties:
        app_name:
          type: string
        app_version:
          type: string
        release_channel:
          type: string
        locale:
          type: string
        web_base_url:
          type: string
          format: uri
        api_base_url:
          type: string
          format: uri
        ws_base_url:
          type: string
        admin_base_url:
          type: string
          format: uri
        rtc_ice_servers:
          type: array
          items:
            type: object
            required: [urls]
            properties:
              urls:
                oneOf:
                  - type: string
                  - type: array
                    items:
                      type: string
              username:
                type: string
              credential:
                type: string
    ZoneCapabilities:
      type: object
      properties:
        chat:
          type: boolean
        files:
          type: boolean
        calls:
          type: boolean
        bots:
          type: boolean
        automation:
          type: boolean
        webhooks:
          type: boolean
        federation:
          type: boolean
        sso:
          type: boolean
          description: Chi true khi OIDC login verifier da duoc deploy.
        oidc_configuration:
          type: boolean
          description: Control-plane API ho tro luu OIDC provider contract.
        custom_domain:
          type: boolean
        dedicated:
          type: boolean
        self_hosted:
          type: boolean
          description: Instance này do customer tự vận hành trên hạ tầng riêng.
    ZoneDeployment:
      type: object
      properties:
        mode:
          type: string
          enum: [shared, dedicated_compose, dedicated_k8s]
        database_mode:
          type: string
          enum: [shared_schema, dedicated_schema, dedicated_database]
        status:
          type: string
          enum: [provisioning, ready, failed, suspended]
    CreateDomainClaimRequest:
      type: object
      required: [domain, zone_name]
      properties:
        domain:
          type: string
          example: chat.customer.example
        zone_name:
          type: string
        registration_mode:
          type: string
          enum: [open, invite_only, closed]
          default: invite_only
    DomainClaim:
      type: object
      required: [id, domain, status, verification_method, verification_dns_name, verification_dns_value, zone]
      properties:
        id:
          type: string
          format: uuid
        domain:
          type: string
        status:
          type: string
          enum: [pending, verified, active, suspended]
        routing_dns_type:
          type: string
          enum: [A, AAAA]
          description: DNS record type used to route the customer domain to the VPSTTT edge.
        routing_dns_name:
          type: string
          description: DNS host that the customer must route to the VPSTTT edge.
        routing_dns_value:
          type: string
          description: IPv4 or IPv6 address of the VPSTTT edge.
        verification_method:
          type: string
          enum: [dns_txt]
        verification_dns_name:
          type: string
        verification_dns_value:
          type: string
        verification_expires_at:
          type: string
          format: date-time
        verification_attempts:
          type: integer
        last_verification_error:
          type: string
        last_checked_at:
          type: string
          format: date-time
        zone:
          $ref: "#/components/schemas/ZoneSummary"
        workspace:
          $ref: "#/components/schemas/ZoneWorkspaceRef"
    UpdateZoneRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 120
        registration_mode:
          type: string
          enum: [open, invite_only, closed]
    CreateZoneDeploymentRequest:
      type: object
      required: [requested_mode, requested_database_mode]
      properties:
        requested_mode:
          type: string
          enum: [shared, dedicated_compose, dedicated_k8s]
        requested_database_mode:
          type: string
          enum: [shared_schema, dedicated_schema, dedicated_database]
