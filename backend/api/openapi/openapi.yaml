        terms_version:
          type: string
          example: "2026-08-07"
        privacy_accepted:
          type: boolean
          description: Required and true only when this Google identity would create a new account; optional for an existing user login.
        privacy_version:
          type: string
          example: "2026-08-07"
        credential:
          type: string
          description: Google ID token do Google Identity Services trả về.
