name: Docker

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: backend/Dockerfile
            context: backend
            target: api
          - name: worker
            dockerfile: backend/Dockerfile
            context: backend
            target: worker
          - name: web
            dockerfile: frontend/apps/web/Dockerfile
            context: frontend
            target: runner
          - name: admin
            dockerfile: frontend/apps/admin/Dockerfile
            context: frontend
            target: runner
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Normalize image namespace
        id: image
        run: echo "namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Validate Dockerfile
        run: |
          if [ ! -f "${{ matrix.dockerfile }}" ]; then
            echo "::error title=Missing Dockerfile::Required Dockerfile not found: ${{ matrix.dockerfile }}"
            exit 1
          fi

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.namespace }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'https://chat.vpsttt.com' }}
            NEXT_PUBLIC_WS_BASE_URL=${{ vars.NEXT_PUBLIC_WS_BASE_URL || 'wss://chat.vpsttt.com/ws' }}
            NEXT_PUBLIC_RTC_ICE_SERVERS=${{ vars.NEXT_PUBLIC_RTC_ICE_SERVERS || vars.RTC_ICE_SERVERS || 'stun:stun.l.google.com:19302' }}
            NEXT_PUBLIC_TERMS_URL=${{ vars.NEXT_PUBLIC_TERMS_URL || 'https://download.vpsttt.com/terms' }}
            NEXT_PUBLIC_PRIVACY_URL=${{ vars.NEXT_PUBLIC_PRIVACY_URL || 'https://download.vpsttt.com/privacy' }}
            NEXT_PUBLIC_TERMS_VERSION=${{ vars.NEXT_PUBLIC_TERMS_VERSION || '2026-08-07' }}
            NEXT_PUBLIC_PRIVACY_VERSION=${{ vars.NEXT_PUBLIC_PRIVACY_VERSION || '2026-08-07' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  verify:
    name: Verify pushed images
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Normalize image namespace
        id: image
        run: echo "namespace=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify manifests
        env:
          IMAGE_NAMESPACE: ${{ steps.image.outputs.namespace }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for service in api worker web admin; do
            image="${REGISTRY}/${IMAGE_NAMESPACE}/${service}:${IMAGE_TAG}"
            echo "Checking ${image}"
            docker manifest inspect "${image}" >/dev/null
          done
