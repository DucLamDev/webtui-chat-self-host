name: CI

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/self-hosted/**"
      - "docs/**"
      - "CleanArchitecture.md"
      - ".github/workflows/ci.yml"
  push:
    branches:
      - main
      - master
      - develop
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/self-hosted/**"
      - "docs/**"
      - "CleanArchitecture.md"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  docs:
    name: Check docs and structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required architecture files
        run: |
          test -f CleanArchitecture.md
          test -f docs/architecture/source-layout.md
          test -f docs/database/postgresql-design.md
          test -f backend/db/migrations/000001_initial_schema.up.sql

      - name: Check common encoding corruption
        run: |
          # Detect common mojibake sequences without flagging valid Vietnamese text.
          pattern="$(printf '\303\204|\303\206|\303\241\302\272|\303\241\302\273|\303\242\342\202\254|\303\242\342\202\254\342\204\242|\303\242\342\202\254\305\223|\303\242\342\202\254\357\277\275|\303\242\342\202\254\342\200\234|\303\242\342\202\254\342\200\235')"
          if grep -RInE "$pattern" --include='*.go' --include='*.md' --include='*.yaml' --include='*.yml' .; then
            echo "Detected text that looks like encoding corruption."
            exit 1
          fi
          if grep -RIn "$(printf '\357\277\275')" --include='*.go' --include='*.md' --include='*.yaml' --include='*.yml' .; then
            echo "Detected Unicode replacement characters."
            exit 1
          fi

      - name: Test off-site backup guardrails
        run: |
          python3 -m unittest discover -s deploy/self-hosted/backup -p 'test_*.py' -v
          python3 -m py_compile deploy/self-hosted/backup/offsite_backup.py
          sh -n deploy/self-hosted/backup.sh
          sh -n deploy/self-hosted/restore.sh
          sh -n deploy/self-hosted/install.sh

      - name: Validate self-host Compose profiles
        working-directory: deploy/self-hosted
        run: |
          docker compose --env-file .env.example -f compose.yml config --quiet
          docker compose --env-file .env.example -f compose.yml \
            --profile push-relay --profile backup --profile restore --profile observability \
            config --quiet
          OFFSITE_BACKUP_INCLUDE_INSTANCE_ENV=true docker compose --env-file .env.example \
            -f compose.yml -f compose.include-instance-env.yml \
            --profile backup --profile restore config --quiet
          relay_config="$(mktemp)"
          trap 'rm -f .env "$relay_config"' EXIT
          cp .env.example .env
          docker compose --env-file .env.example -f compose.yml --profile push-relay \
            config --format json > "$relay_config"
          python3 - "$relay_config" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              services = json.load(stream)["services"]

          expected = {
              "migrate": {
                  "APP_ENV", "APP_NAME", "APP_VERSION", "DATABASE_ENABLED",
                  "DATABASE_MIGRATIONS_PATH", "DATABASE_URL", "LOG_FORMAT",
                  "LOG_LEVEL", "SERVICE_NAME",
              },
              "push-relay": {
                  "APP_ENV", "APP_NAME", "APP_VERSION", "APNS_BUNDLE_ID",
                  "APNS_KEY_ID", "APNS_PRIVATE_KEY_BASE64", "APNS_PRIVATE_KEY_FILE",
                  "APNS_SANDBOX", "APNS_TEAM_ID", "DATABASE_ENABLED", "DATABASE_URL",
                  "FIREBASE_PROJECT_ID", "FIREBASE_SERVICE_ACCOUNT_FILE",
                  "FIREBASE_SERVICE_ACCOUNT_JSON_BASE64", "LOG_FORMAT", "LOG_LEVEL",
                  "OTEL_ENABLED", "OTEL_EXPORTER_OTLP_ENDPOINT", "OTEL_TRACE_SAMPLE_RATIO",
                  "PUSH_RELAY_HTTP_HOST", "PUSH_RELAY_HTTP_PORT",
                  "PUSH_RELAY_MAX_BODY_BYTES", "PUSH_RELAY_POLL_INTERVAL",
                  "PUSH_RELAY_PUBLISHERS", "PUSH_RELAY_RATE_LIMIT_BURST",
                  "PUSH_RELAY_RATE_LIMIT_PER_MINUTE", "PUSH_RELAY_SERVER_ENABLED",
                  "PUSH_RELAY_WORKER_CONCURRENCY", "SERVICE_NAME",
              },
          }
          for service_name, allowed in expected.items():
              actual = set(services[service_name].get("environment", {}))
              if actual != allowed:
                  raise SystemExit(
                      f"{service_name} environment differs from its allowlist: "
                      f"extra={sorted(actual - allowed)}, missing={sorted(allowed - actual)}"
                  )
          PY

  backend:
    name: Backend Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check go.mod
        id: gomod
        run: |
          if [ -f go.mod ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Go
        if: steps.gomod.outputs.exists == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test
        if: steps.gomod.outputs.exists == 'true'
        run: go test ./...

      - name: Realtime race test
        if: steps.gomod.outputs.exists == 'true'
        run: go test -race ./internal/platform/websocket/...

      - name: Vet
        if: steps.gomod.outputs.exists == 'true'
        run: go vet ./...

      - name: Vulnerability scan
        if: steps.gomod.outputs.exists == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check package.json
        id: package
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.package.outputs.exists == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.package.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci

      - name: Dependency audit
        if: steps.package.outputs.exists == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Typecheck
        if: steps.package.outputs.exists == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Lint
        if: steps.package.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Unit test
        if: steps.package.outputs.exists == 'true'
        working-directory: frontend
        run: npm run test:unit

      - name: Build web
        if: steps.package.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build:web

      - name: Build admin
        if: steps.package.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build:admin
