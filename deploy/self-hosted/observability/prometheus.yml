global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    deployment: self-hosted

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: webtui-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8080]

  # The relay is an opt-in Compose profile. When it is disabled this target is
  # simply absent; relay-specific alert rules only evaluate when its aggregate
  # series exist.
  - job_name: webtui-push-relay
    metrics_path: /metrics
    static_configs:
      - targets: [push-relay:8090]

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: [otel-collector:8888]
