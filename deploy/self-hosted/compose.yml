name: vpsttt-chat

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks: [backend]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  migrate:
    build:
      context: ../../backend
      target: api
    image: vpsttt-chat-api:${APP_VERSION:-self-hosted}
    env_file:
      - path: .env
        required: false
    command: ["migrate", "up"]
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  storage-permissions:
    image: alpine:3.22
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /var/lib/vpsttt-chat/storage /var/lib/vpsttt-chat/backups
        chown -R 10001:10001 /var/lib/vpsttt-chat/storage /var/lib/vpsttt-chat/backups
        chmod -R u+rwX,g+rwX /var/lib/vpsttt-chat/storage /var/lib/vpsttt-chat/backups
    volumes:
      - storage_data:/var/lib/vpsttt-chat/storage
      - backup_data:/var/lib/vpsttt-chat/backups
    restart: "no"

  api:
    build:
      context: ../../backend
      target: api
    image: vpsttt-chat-api:${APP_VERSION:-self-hosted}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SERVICE_NAME: api
    volumes:
      - storage_data:/var/lib/vpsttt-chat/storage
      - backup_data:/var/lib/vpsttt-chat/backups
    expose: ["8080"]
    networks: [backend]
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ../../backend
      target: worker
    image: vpsttt-chat-worker:${APP_VERSION:-self-hosted}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SERVICE_NAME: worker
    volumes:
      - storage_data:/var/lib/vpsttt-chat/storage
      - backup_data:/var/lib/vpsttt-chat/backups
    networks: [backend]
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  web:
    build:
      context: ../../frontend
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${INSTANCE_DOMAIN}
        NEXT_PUBLIC_APP_NAME: ${INSTANCE_NAME}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_RTC_ICE_SERVERS: ${NEXT_PUBLIC_RTC_ICE_SERVERS}
        NEXT_PUBLIC_JITSI_BASE_URL: ${NEXT_PUBLIC_JITSI_BASE_URL:-}
        NEXT_PUBLIC_WS_BASE_URL: wss://${INSTANCE_DOMAIN}/ws
    image: vpsttt-chat-web:${APP_VERSION:-self-hosted}
    restart: unless-stopped
    expose: ["3000"]
    networks: [backend]

  admin:
    build:
      context: ../../frontend
      dockerfile: apps/admin/Dockerfile
      args:
        ADMIN_BASE_PATH: /admin
        NEXT_PUBLIC_API_BASE_URL: https://${INSTANCE_DOMAIN}
        NEXT_PUBLIC_APP_NAME: ${INSTANCE_NAME}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_RTC_ICE_SERVERS: ${NEXT_PUBLIC_RTC_ICE_SERVERS}
        NEXT_PUBLIC_WS_BASE_URL: wss://${INSTANCE_DOMAIN}/ws
    image: vpsttt-chat-admin:${APP_VERSION:-self-hosted}
    restart: unless-stopped
    expose: ["3001"]
    networks: [backend]

  portal:
    build:
      context: ../../../webtui-chat-portal
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_DESKTOP_DOWNLOAD_URL: ${DESKTOP_DOWNLOAD_URL:-https://download.vpsttt.com/download/}
        NEXT_PUBLIC_DOCUMENTATION_URL: ${DOCUMENTATION_URL:-https://download.vpsttt.com/#self-host}
        NEXT_PUBLIC_MOBILE_DOWNLOAD_URL: ${MOBILE_DOWNLOAD_URL:-https://download.vpsttt.com/download/}
        NEXT_PUBLIC_PORTAL_BASE_PATH: ""
    image: vpsttt-chat-portal:${PORTAL_VERSION:-self-hosted}
    restart: unless-stopped
    expose: ["3002"]
    networks: [backend]

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      INSTANCE_DOMAIN: ${INSTANCE_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
      PORTAL_DOMAIN: ${PORTAL_DOMAIN:-download.vpsttt.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../../webtui-chat-portal/download:/srv/portal-download:ro
      - storage_data:/srv/vpsttt-storage:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      admin:
        condition: service_started
      portal:
        condition: service_started

  coturn:
    image: coturn/coturn:4.14.0-alpine
    restart: unless-stopped
    command:
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=${INSTANCE_DOMAIN}
      - --user=${TURN_USERNAME}:${TURN_PASSWORD}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --lt-cred-mech
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=224.0.0.0-255.255.255.255
      - --log-file=stdout
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - coturn_data:/var/lib/coturn
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
    name: vpsttt_chat_postgres_data
  redis_data:
    name: vpsttt_chat_redis_data
  rabbitmq_data:
    name: vpsttt_chat_rabbitmq_data
  ollama_data:
    name: vpsttt_chat_ollama_data
  storage_data:
    name: vpsttt_chat_storage_data
  backup_data:
    name: vpsttt_chat_backup_data
  caddy_data:
    name: vpsttt_chat_caddy_data
  caddy_config:
    name: vpsttt_chat_caddy_config
  coturn_data:
    name: vpsttt_chat_coturn_data
