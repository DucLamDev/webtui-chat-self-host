name: vpsttt-chat

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4.1-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [backend]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks: [backend]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s

  migrate:
    build:
      context: ../../backend
      target: api
    image: vpsttt-chat-api:${APP_VERSION:-self-hosted}
    command: ["migrate", "up"]
    # Deliberately do not inject .env; migrations need only app/logging + DB.
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME:-webtui-chat}
      APP_VERSION: ${APP_VERSION:-self-hosted}
      DATABASE_ENABLED: ${DATABASE_ENABLED:-true}
      DATABASE_MIGRATIONS_PATH: ${DATABASE_MIGRATIONS_PATH:-db/migrations}
      DATABASE_URL: ${DATABASE_URL:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SERVICE_NAME: migrate
    networks: [backend]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  storage-permissions:
    image: alpine:3.22
    command:
      - sh
      - -c
      - |
        set -eu
        mkdir -p /var/lib/vpsttt-chat/storage /var/lib/vpsttt-chat/backups
        chown -R 10001:10001 /var/lib/vpsttt-chat/storage /var/lib/vpsttt-chat/backups
        chmod -R u+rwX,g+rwX /var/lib/vpsttt-chat/storage /var/lib/vpsttt-chat/backups
    volumes:
      - storage_data:/var/lib/vpsttt-chat/storage
      - backup_data:/var/lib/vpsttt-chat/backups
    restart: "no"

  offsite-backup:
    profiles: ["backup"]
    build:
      context: ./backup
    image: vpsttt-chat-offsite-backup:${APP_VERSION:-self-hosted}
    restart: on-failure:5
    env_file:
      # Only the dedicated DR credential file is injected wholesale. App
      # settings required to read PostgreSQL/storage are allowlisted below.
      - path: offsite-backup.env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-webtui-self-host}
      APP_VERSION: ${APP_VERSION:-self-hosted}
      DATABASE_URL: ${DATABASE_URL:-}
      INSTANCE_DOMAIN: ${INSTANCE_DOMAIN:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      OFFSITE_RESTORE_ALLOW_APPLY: "false"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SOURCE_CONFIG_PATH: /source/config
      SOURCE_STORAGE_PATH: /source/storage
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
    command: ["schedule"]
    volumes:
      - storage_data:/source/storage:ro
      - backup_data:/var/lib/vpsttt-chat/backups
      - type: bind
        source: ./compose.yml
        target: /source/config/compose.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./Caddyfile
        target: /source/config/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    networks: [backend]
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  # This service is never started by the normal stack or backup profile. The
  # guarded restore wrapper invokes it explicitly after staging and checksum
  # verification, with the application already in maintenance mode.
  offsite-restore:
    profiles: ["restore"]
    build:
      context: ./backup
    image: vpsttt-chat-offsite-backup:${APP_VERSION:-self-hosted}
    restart: "no"
    env_file:
      - path: offsite-backup.env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-webtui-self-host}
      APP_VERSION: ${APP_VERSION:-self-hosted}
      DATABASE_URL: ${DATABASE_URL:-}
      INSTANCE_DOMAIN: ${INSTANCE_DOMAIN:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      OFFSITE_RESTORE_ALLOW_APPLY: "true"
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SOURCE_CONFIG_PATH: /source/config
      SOURCE_STORAGE_PATH: /source/storage
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
    command: ["--help"]
    volumes:
      - storage_data:/source/storage
      - backup_data:/var/lib/vpsttt-chat/backups
      - type: bind
        source: ./compose.yml
        target: /source/config/compose.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./Caddyfile
        target: /source/config/Caddyfile
        read_only: true
        bind:
          create_host_path: false
    networks: [backend]
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../../backend
      target: api
    image: vpsttt-chat-api:${APP_VERSION:-self-hosted}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      SERVICE_NAME: api
      # The API serves only the public VAPID key; keep the signing key in the worker.
      WEB_PUSH_VAPID_PRIVATE_KEY: ""
      # Provider and publisher credentials are delivery-only secrets.
      FIREBASE_PROJECT_ID: ""
      FIREBASE_SERVICE_ACCOUNT_FILE: ""
      FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ""
      APNS_KEY_ID: ""
      APNS_TEAM_ID: ""
      APNS_BUNDLE_ID: ""
      APNS_PRIVATE_KEY_FILE: ""
      APNS_PRIVATE_KEY_BASE64: ""
      PUSH_RELAY_URL: ""
      PUSH_RELAY_TOKEN: ""
      PUSH_RELAY_INSTANCE_ID: ""
      PUSH_RELAY_PUBLISHERS: ""
    volumes:
      - storage_data:/var/lib/vpsttt-chat/storage
      - backup_data:/var/lib/vpsttt-chat/backups
    expose: ["8080"]
    networks: [backend]
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    build:
      context: ../../backend
      target: worker
    image: vpsttt-chat-worker:${APP_VERSION:-self-hosted}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SERVICE_NAME: worker
      # Publisher authentication belongs only to the standalone relay process.
      PUSH_RELAY_PUBLISHERS: ""
    volumes:
      - storage_data:/var/lib/vpsttt-chat/storage
      - backup_data:/var/lib/vpsttt-chat/backups
    networks: [backend]
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  push-relay:
    profiles: ["push-relay"]
    build:
      context: ../../backend
      target: push-relay
    image: vpsttt-chat-push-relay:${APP_VERSION:-self-hosted}
    restart: unless-stopped
    # Provider credentials are required here, but unrelated application secrets
    # stay out of the relay process. Keep this explicit allowlist instead of .env.
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_NAME: ${APP_NAME:-webtui-chat}
      APP_VERSION: ${APP_VERSION:-self-hosted}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_PRIVATE_KEY_BASE64: ${APNS_PRIVATE_KEY_BASE64:-}
      APNS_PRIVATE_KEY_FILE: ${APNS_PRIVATE_KEY_FILE:-}
      APNS_SANDBOX: ${APNS_SANDBOX:-false}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      DATABASE_ENABLED: ${DATABASE_ENABLED:-true}
      DATABASE_URL: ${DATABASE_URL:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_SERVICE_ACCOUNT_FILE: ${FIREBASE_SERVICE_ACCOUNT_FILE:-}
      FIREBASE_SERVICE_ACCOUNT_JSON_BASE64: ${FIREBASE_SERVICE_ACCOUNT_JSON_BASE64:-}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACE_SAMPLE_RATIO: ${OTEL_TRACE_SAMPLE_RATIO:-0.10}
      PUSH_RELAY_HTTP_HOST: ${PUSH_RELAY_HTTP_HOST:-0.0.0.0}
      PUSH_RELAY_HTTP_PORT: ${PUSH_RELAY_HTTP_PORT:-8090}
      PUSH_RELAY_MAX_BODY_BYTES: ${PUSH_RELAY_MAX_BODY_BYTES:-32768}
      PUSH_RELAY_POLL_INTERVAL: ${PUSH_RELAY_POLL_INTERVAL:-1s}
      PUSH_RELAY_PUBLISHERS: ${PUSH_RELAY_PUBLISHERS:-}
      PUSH_RELAY_RATE_LIMIT_BURST: ${PUSH_RELAY_RATE_LIMIT_BURST:-60}
      PUSH_RELAY_RATE_LIMIT_PER_MINUTE: ${PUSH_RELAY_RATE_LIMIT_PER_MINUTE:-240}
      PUSH_RELAY_SERVER_ENABLED: ${PUSH_RELAY_SERVER_ENABLED:-false}
      PUSH_RELAY_WORKER_CONCURRENCY: ${PUSH_RELAY_WORKER_CONCURRENCY:-4}
      SERVICE_NAME: push-relay
    expose: ["8090"]
    networks: [backend]
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:$${PUSH_RELAY_HTTP_PORT}/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ../../frontend
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: https://${INSTANCE_DOMAIN}
        NEXT_PUBLIC_APP_NAME: ${INSTANCE_NAME}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_RTC_ICE_SERVERS: ${NEXT_PUBLIC_RTC_ICE_SERVERS}
        NEXT_PUBLIC_JITSI_BASE_URL: ${NEXT_PUBLIC_JITSI_BASE_URL:-}
        NEXT_PUBLIC_WS_BASE_URL: wss://${INSTANCE_DOMAIN}/ws
    image: vpsttt-chat-web:${APP_VERSION:-self-hosted}
    restart: unless-stopped
    expose: ["3000"]
    networks: [backend]

  admin:
    build:
      context: ../../frontend
      dockerfile: apps/admin/Dockerfile
      args:
        ADMIN_BASE_PATH: /admin
        NEXT_PUBLIC_API_BASE_URL: https://${INSTANCE_DOMAIN}
        NEXT_PUBLIC_APP_NAME: ${INSTANCE_NAME}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        NEXT_PUBLIC_RTC_ICE_SERVERS: ${NEXT_PUBLIC_RTC_ICE_SERVERS}
        NEXT_PUBLIC_WS_BASE_URL: wss://${INSTANCE_DOMAIN}/ws
    image: vpsttt-chat-admin:${APP_VERSION:-self-hosted}
    restart: unless-stopped
    expose: ["3001"]
    networks: [backend]

  tempo:
    profiles: ["observability"]
    image: grafana/tempo:2.10.5
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    expose: ["3200", "4317", "4318"]
    networks: [backend]

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.153.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yml"]
    volumes:
      - ./observability/otel-collector.yml:/etc/otelcol-contrib/config.yml:ro
    expose: ["4317", "4318", "8888", "13133"]
    networks: [backend]
    depends_on:
      tempo:
        condition: service_started

  alertmanager:
    profiles: ["observability"]
    image: prom/alertmanager:v0.32.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    expose: ["9093"]
    networks: [backend]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    expose: ["9090"]
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started
      otel-collector:
        condition: service_started

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME_RANDOM_GRAFANA_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3300}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [backend]
    depends_on:
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      INSTANCE_DOMAIN: ${INSTANCE_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - storage_data:/srv/vpsttt-storage:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
      admin:
        condition: service_started

  coturn:
    image: coturn/coturn:4.14.0-alpine
    restart: unless-stopped
    command:
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --realm=${INSTANCE_DOMAIN}
      - --external-ip=${TURN_EXTERNAL_IP}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-multicast-peers
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=224.0.0.0-255.255.255.255
      - --log-file=stdout
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - coturn_data:/var/lib/coturn
    networks: [backend]

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
    name: vpsttt_chat_postgres_data
  redis_data:
    name: vpsttt_chat_redis_data
  rabbitmq_data:
    name: vpsttt_chat_rabbitmq_data
  ollama_data:
    name: vpsttt_chat_ollama_data
  storage_data:
    name: vpsttt_chat_storage_data
  backup_data:
    name: vpsttt_chat_backup_data
  caddy_data:
    name: vpsttt_chat_caddy_data
  caddy_config:
    name: vpsttt_chat_caddy_config
  coturn_data:
    name: vpsttt_chat_coturn_data
  tempo_data:
    name: vpsttt_chat_tempo_data
  prometheus_data:
    name: vpsttt_chat_prometheus_data
  alertmanager_data:
    name: vpsttt_chat_alertmanager_data
  grafana_data:
    name: vpsttt_chat_grafana_data
